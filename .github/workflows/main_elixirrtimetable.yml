# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - elixirrtimetable

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      reminder_app:
        description: 'Optional reminder Function App name'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          python -m pytest tests/ -q
                
      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size. 
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5FD5E4D7E01A494E8E6C7E9F2F82762C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A87EB7BC62E84EA7B132F43DA7CC74DD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_29E40093FE5C4F93A8243E114D6320D3 }}

      - name: Check authentication readiness
        id: auth-readiness
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_29E40093FE5C4F93A8243E114D6320D3 }}
        run: |
          set -euo pipefail
          settings="$(az webapp config appsettings list --subscription "$SUBSCRIPTION_ID" --resource-group Microsoft-Academy --name elixirrtimetable --query "[].{name:name,nonempty:value != null && value != ''}" -o json)"
          ready=true
          for name in TIMETABLE_AUTH_MODE EMPLOYEE_TENANT_ID LOGIN_CLIENT_ID APP_ORIGIN TIMETABLE_LOGIN_SECRET; do
            if ! jq -e --arg name "$name" 'any(.[]; .name == $name and .nonempty)' <<< "$settings" >/dev/null; then
              echo "::warning::Authentication setting $name is missing or empty."
              ready=false
            fi
          done
          auth="$(az rest --method GET --url "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/Microsoft-Academy/providers/Microsoft.Web/sites/elixirrtimetable/config/authsettingsV2/list?api-version=2024-04-01" --query 'properties.platform.enabled && properties.globalValidation.requireAuthentication && properties.identityProviders.azureActiveDirectory.enabled' -o tsv)"
          if [[ "$auth" != "true" ]]; then
            echo '::warning::App Service company authentication is not enabled and required.'
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != "true" ]]; then
            echo 'Web deployment skipped: configure and verify company authentication first.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 'Deploy to Azure Web App'
        if: ${{ steps.auth-readiness.outputs.ready == 'true' }}
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'elixirrtimetable'
          slot-name: 'Production'

  deploy-reminders:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reminder_app != '' }}
    concurrency:
      group: timetable-reminder-deployment
      cancel-in-progress: false
    env:
      REMINDER_APP: ${{ inputs.reminder_app }}
      REMINDER_RESOURCE_GROUP: rg-timetable-reminder
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Linux reminder package
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/reminder-package"
          mkdir -p "$package_dir/.python_packages/lib/site-packages" "$package_dir/services"
          python -m pip install -r requirements.txt --target "$package_dir/.python_packages/lib/site-packages"
          cp function_app.py config.py host.json "$package_dir/"
          cp services/*.py "$package_dir/services/"
          cp -R services/attachments "$package_dir/services/"
          cd "$package_dir"
          zip -q -r "$RUNNER_TEMP/reminder-package.zip" .
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5FD5E4D7E01A494E8E6C7E9F2F82762C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A87EB7BC62E84EA7B132F43DA7CC74DD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_29E40093FE5C4F93A8243E114D6320D3 }}
      - name: Publish reminder package
        run: |
          set -euo pipefail
          app_tag="$(az functionapp show --resource-group "$REMINDER_RESOURCE_GROUP" --name "$REMINDER_APP" --query 'tags.app' -o tsv)"
          if [[ "$app_tag" != 'timetable-reminder' ]]; then
            echo 'The selected app is not the timetable reminder worker.' >&2
            exit 1
          fi
          storage="$(az functionapp config appsettings list --resource-group "$REMINDER_RESOURCE_GROUP" --name "$REMINDER_APP" --query "[?name=='AzureWebJobsStorage__accountName'].value | [0]" -o tsv)"
          if [[ -z "$storage" || "$storage" == 'None' ]]; then
            echo 'The reminder worker storage account is not configured.' >&2
            exit 1
          fi
          blob_name="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          az storage blob upload --account-name "$storage" --container-name function-package --name "$blob_name" --file "$RUNNER_TEMP/reminder-package.zip" --auth-mode login --overwrite false --output none
          az storage blob upload --account-name "$storage" --container-name function-package --name current.zip --file "$RUNNER_TEMP/reminder-package.zip" --auth-mode login --overwrite true --output none
          az functionapp restart --resource-group "$REMINDER_RESOURCE_GROUP" --name "$REMINDER_APP"
          app_id="$(az functionapp show --resource-group "$REMINDER_RESOURCE_GROUP" --name "$REMINDER_APP" --query id -o tsv)"
          for attempt in 1 2 3 4 5 6; do
            if az rest --method post --url "https://management.azure.com${app_id}/syncfunctiontriggers?api-version=2016-08-01" --output none; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 10
            fi
          done
          echo 'Failed to synchronize reminder triggers.' >&2
          exit 1
          